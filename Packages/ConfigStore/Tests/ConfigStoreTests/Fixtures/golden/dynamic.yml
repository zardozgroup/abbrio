# Snippets with dynamic parts.
matches:
  # A plain reply.
  - trigger: ";ty"
    replace: "Thank you for your email. I'll reply in full by "
    label: Thanks reply   # keep

  - trigger: ";dear"
    label: "Letter salutation"
    replace: "Dear {{form1.first_name}} {{form1.last_name}},"
    vars:
      # who it is for
      - name: form1
        type: form
        params:
          layout: "First name: [[first_name]]\nLast name: [[last_name]]"
          fields:
            first_name:
              default: "Thomas"

  - trigger: ";sig"
    form: |
      Regards,
      [[name]] ([[team]])
    form_fields:
      team:
        type: choice
        values: [Support, Sales]

  - trigger: ";due"
    replace: "Due {{due}} at {{clock}}"
    vars:
      - name: due
        type: date
        params:
          format: "%d/%m/%Y"
          offset: 604800   # one week
      - name: clock
        type: date
        params: {format: "%H:%M"}

# End.
